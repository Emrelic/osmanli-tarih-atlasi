<body>
<header id="ustbar">
  <!-- p2/H-0010 — kullanıcı: "Hakkında butonuna artık gerek yok. Buradaki
       butonları tek bir 'butonları aç' butonuna tıklanınca dizilecek şekilde
       saklayalım. İmparatorluk combobox'ını da üst çubuğa alalım."
       Düzen soldan sağa: [butonları aç] · orta (tarih+dönem) · bölge · YIL ·
       başlık. Hakkında (proje künyesi + BEKLEYENLER tablosu) TAMAMEN
       kaldırıldı — js/app.js'teki hakkindaKur ve eşleri de silindi. -->
  <button id="btn-menu" title="Araç düğmelerini göster/gizle">☰ Butonlar</button>
  <div id="menu-butonlar" class="gizli">
    <button id="btn-dizin" title="Kişi, savaş ve antlaşma dizinleri">📚 Dizin</button>
    <button id="btn-cografya" title="Kendi coğrafya katmanımız: kara, göl, nehir, dağ. Açılınca Esri altlığı kapanır — altlığın bize geçtiğinde nasıl görüneceği.">🗺 Coğrafya</button>
    <button id="btn-motorhat" title="Motorun sınırları yasladığı hatlar: gördüğü nehirler (camgöbeği) ve dağ konturları (turuncu). Kesikli çizilir, sınırla karışmasın.">📐 Motor hatları</button>
    <!-- Veri sınırı: üretim penceresinin (BOLGE) kenarı. Kullanıcı beş kez
         "burası neden boş" diye sordu; beşi de bu kutunun iki kenarıydı
         (Orta Asya 62°D'nin doğusu, kuzey İskandinavya 62°K'nin kuzeyi).
         Çizgi açıkken cevap ekranda oluyor. Dikdörtgen olması kasıtlı:
         hiçbir siyasî/tabiî sınır tam dikdörtgen değildir. -->
    <button id="btn-verisiniri" title="Atlasın veri sınırı: bu dikdörtgenin ötesi henüz atlasa dâhil değil. Boş görünen yerlerin sebebi budur.">▦ Veri sınırı</button>
    <!-- Koridor ağı: menzil (ulak/posta) yolları. SINIR DEĞİL YOL — o yüzden
         noktalı çizgi ve kehribar rengi; sınır çizgileriyle de motor
         hatlarıyla da karışmasın. Menzil sistemi TDV'ye göre 1539-1839
         arası kurumdur, katman o aralığın DIŞINDA hiç çizilmez. -->
    <button id="btn-koridor" title="Menzil (ulak/posta) yolları: duraklar ve aralarındaki hatlar. Sınır değil YOL — noktalı çizilir. Yalnız 1539-1839 arasında görünür; içi boş duraklar kaynağı bulunamamış, SEÇİLMİŞ duraklardır.">🐎 Koridor ağı</button>
    <button id="btn-tamekran" title="Tam ekran (F11)">⛶</button>
    <!-- 🔴 EMRE, 18 Ağustos 2026: "tüm imparatorluk combobox'ını butonlar
         içine koyabiliriz." p2/H-0010'da üst çubuğa alınmıştı; üst çubuk
         doldu, şimdi butonların içine giriyor. id="bolge" AYNI kaldı —
         js/app.js id üzerinden çalışıyor, tek satır kod değişmedi. -->
    <select id="bolge" title="Bölgeye yakınlaş">
      <option value="">🌍 Tüm imparatorluk</option>
      <option value="anadolu">Anadolu</option>
      <option value="rumeli">Rumeli / Balkanlar</option>
      <option value="avrupa">Orta Avrupa (Macaristan)</option>
      <option value="ege">Ege ve adalar</option>
      <option value="karadeniz">Karadeniz kuzeyi / Rus sınırı</option>
      <option value="kafkas">Kafkasya ve İran sınırı</option>
      <option value="suriye">Suriye ve Irak</option>
      <option value="hicaz">Hicaz ve Yemen</option>
      <option value="misir">Mısır ve Sudan</option>
      <option value="afrika">Kuzey Afrika</option>
    </select>
    <!-- ⚙ Ayarlar düğmesi §⑧②'de kronoloji başlığına taşındı — burada
         DUPLICATE id AÇMAMAK için tekrar edilmedi (bkz. #olay-akisi h2). -->
  </div>
  <div id="ustbar-orta">
    <span id="ustbar-tarih"></span>
    <!-- p23/H-0014 — #donem-etiketi artık DÖNEM adını değil, o anki KRONOLOJİ
         MADDESİNİ taşıyor. Dönemin kendi adı ("Kayıp: Budin") #tepe-degisim'e
         geçti ve YALNIZ değişimin olduğu gün görünüyor; gerekçe js/app.js
         tepeEtiketGuncelle() başlığında. -->
    <span id="donem-etiketi"></span>
    <span id="tepe-degisim"></span>
  </div>
  <!-- #bolge-secici KALDIRILDI — seçici `#menu-butonlar` içine taşındı
       (Emre, 18 Ağustos 2026). Üst çubukta yalnız tarih·dönem·yıl·başlık
       kaldı; id="bolge" değişmediği için js/app.js'e dokunulmadı. -->

  <div id="ustbar-yil"></div>
  <h1>🕌 Osmanlı Tarih Atlası <span class="alt">1281–1923</span></h1>
</header>

<main id="govde">
  <div id="harita">
    <!-- 🔴 EMRE, 19 Ağustos 2026: panel genişliği "şimdiki" ve "dar" (%60)
         olmak üzere İKİ KADEME, ve ayarlanabilir olsun. Düğme #btn-panel'in
         yanına kondu çünkü ikisi de AYNI şeyin ayarı: panelin harita
         karşısındaki payı (katla = 0 · dar = %60 · geniş = %100).
         Sarmal `#harita-dugmeler`: iki düğmenin arası px ile değil flex
         `gap` ile veriliyor, metin uzunluğu değişince kaymasın diye. -->
    <div id="harita-dugmeler">
      <button id="btn-panel-genislik" title="Dar / geniş panel">↔ Dar</button>
      <button id="btn-panel" title="Yan paneli gizle/göster (haritayı büyüt)">⇥ Panel</button>
    </div>
    <!-- Bölge önayarları p2/H-0010 ile üst çubuğa taşındı (id="bolge" aynı,
         yalnız DOM konumu değişti — js/app.js id üzerinden çalışıyor). -->
    <!-- p2/H-0006 — kullanıcı: "sağdaki kronoloji sütunu kapatılabilir ve tam
         ekran harita bakılabilir olmalı. Sütun kapatılırsa kronoloji başlığı
         haritanın en altında ... sene, tarih ve olay başlığı ile görünsün."
         #btn-panel ile aynı tıkta yönetiliyor (js/app.js). -->
    <!-- 🔴 ALTTAKİ KRONOLOJİ ŞERİDİ KALDIRILDI — 19 Ağustos 2026.
         Emre: *"haritanın hem üstünde hem altında iki şerit var, kronoloji
         maddesini yazıyor. Alttakinin mânâsı ne? Onu kaldıralım, üstteki
         yeter."*
         📌 VE HAKLI OLMASININ SEBEBİ BİR ÖNCEKİ DÜZELTME: şerit (`p2/H-0006`)
         panel katlıyken kronoloji büsbütün kaybolmasın diye vardı ve o zaman
         TEK gösterendi — üstteki çubuk o gün toprak değişimini yazıyordu
         ("Kayıp: Budin"). `0023/H-0014` düzeltilip tepe metni kronoloji
         maddesine bağlanınca ikisi AYNI ŞEYİ yazar oldu.
         ⇒ Şerit bozulmadı, GEREKÇESİ ortadan kalktı. Bir düzeltmenin başka
         bir parçayı gereksizleştirmesi, o parçayı kusur yapmaz — ama yerinde
         bırakmak GÜRÜLTÜ yapar.
         ⚠️ `js/app.js`teki `kronolojiSeritGuncelle()` ve `haritaOfseti()`
         DURUYOR; ikisi de null-korumalı (`if (!kronolojiSerit …)` ve
         `if (serit && …)`) ve öğe yokken sessizce atlanıyor. Silmedim çünkü
         şeridin niçin var olduğunu anlatan gerekçe orada yazılı; silmek
         dersi de silerdi (`CLAUDE.md §3.5.1`: vakayı damgala, silme).
         ⚠️ `class="gizli"` bırakıp öğeyi TUTMAK YETMEZ, ölçüldü: `app.js`
         panel katlanınca `gizli` sınıfını KALDIRIYOR (`classList.toggle`),
         `hidden` özniteliği de işe yaramaz çünkü `#kronoloji-serit`in kendi
         kuralı tarayıcının `[hidden]` kuralını özgüllükte yener. Öğe
         BÜSBÜTÜN çıkarıldı — yarım tedbir burada hiç tedbir değildi. -->

  </div>

  <aside id="yanpanel">
    <section id="padisah-karti">
      <div id="padisah-portre"></div>
      <div id="padisah-bilgi">
        <div id="padisah-ad">—</div>
        <div id="padisah-saltanat"></div>

        <select id="odak-devlet" title="Haritanın ve kronolojinin odağını başka bir devlete al">

    <section id="olay-akisi">
      <!-- ARAYUZ-4-SARTNAME.md §⑧ — Emre: "ayar checkbox'ın yanında olsun,

           başlığın ALTINDA ayrı satırdı; Emre ayarın varlığını göremiyordu

      <h2>
        <span id="olay-akisi-baslik">
          <span>📜 Kronoloji</span>
          <span id="olay-sayac"></span>
        </span>
        <span id="ucus-grup">
          <label id="ucus-kontrol" title="Sıradaki olaya geçilince harita o yeri kendiliğinden ortalar">
            <input type="checkbox" id="ucus-ac"> 🛩
          </label>
          <select id="ucus-kip" title="Geçiş biçimi">
            <option value="ani">Ani</option>
            <option value="ucus" selected>Uçuş</option>
          </select>
          <button id="btn-ayarlar" title="Uçuş kipi ayarları: irtifa, yakınlık, hız, kenar payı">⚙</button>
        </span>
      </h2>
      <div id="olay-listesi"></div>
    </section>
    <!-- Olay bilgi paneli: haritanın üzerinde değil, kronolojinin ALTINDA -->
    <section id="olay-bilgi" class="gizli">
      <button id="olay-bilgi-kapat" title="Kapat">✕</button>
      <div id="ob-ust">
        <div id="ob-gorsel"></div>
        <div id="ob-baslikalan">
          <div id="ob-tarih"></div>
          <div id="ob-baslik"></div>
          <div id="ob-meta"></div>
        </div>
      </div>
      <!-- ARAYUZ-AYNI-GUN.md — "aynı güne düşen madde grubu" şeridi. Yalnız
           2+ maddeli günlerde dolar (js/app.js ayniGunSeridiGuncelle); tek
           maddeli günde HİÇ görünmez, boşken de yer kaplamaz (:empty). -->
      <div id="ob-ayni-gun"></div>
      <!-- ARAYUZ-4-SARTNAME.md ④ — "yer_id/yer_kon ikisi de yoksa kart

      <div id="ob-yer-yok"></div>
      <div id="ob-detay"></div>
      <div id="ob-ozel"></div>
      <!-- DUYGU-VE-SEKME-SARTNAME.md §B — PADISAH-KARTVIZITI.md yalnız

           §B③: sekme kaydırıcısı; İÇERİĞİ OLMAYAN sekme HİÇ açılmaz (gri
           de durmaz), tek sekme kalırsa çubuk hiç çizilmez — bugün yalnız

           var; sebep-sonuç/ek-okuma verisi geldiğinde js/app.js'e yeni
           panel eklemek yeter, bu iskelet zaten çoğaltılabilir. -->
      <section id="ob-kartvizit" class="gizli">
        <div id="kv-sekmeler"></div>
        <div class="kv-panel" data-sekme="kisi">
          <div class="kv-kunye"></div>
          <div class="kv-nasil-bilirdiniz">
            <div class="kv-satir kv-ovgu"></div>
            <div class="kv-satir kv-yergi"></div>
            <div class="kv-satir kv-tartisma"></div>
            <div class="kv-satir kv-tarihciler"></div>
          </div>

        <div class="kv-panel" data-sekme="magazin">
          <div class="kv-magazin"></div>
        </div>
      </section>
      <!-- EK-OKUMA.md + MERAK.md — buton yalnız kart VARSA çıkar (js/app.js).
           data/ekokuma.js + data/merak.js ana yüke KATILMAZ, ilk gerektiğinde
           arka planda yükleniyor. -->
      <div id="ob-ekokuma-butonlar"></div>
    </section>
  </aside>

<footer id="zamanbar">
  <button id="btn-geri" title="Önceki olaya git">⏮</button>
  <button id="btn-oynat" title="Oynat / Duraklat">▶</button>
  <button id="btn-ileri" title="Sonraki olaya git">⏭</button>
  <select id="akis-modu" title="Akış tipi: doğrusal zaman veya olay olay">

    <option value="olay">📜 Olay olay</option>
  </select>
  <select id="hiz" title="Oynatma hızı (gün/saniye)">
    <option value="30">Yavaş (ay/sn)</option>
    <option value="180" selected>Normal (6 ay/sn)</option>
    <option value="730">Hızlı (2 yıl/sn)</option>
    <option value="3650">Çok hızlı (10 yıl/sn)</option>
  </select>
  <select id="olay-hiz" title="Her olayda bekleme süresi" style="display:none">
    <option value="3000">3 sn/olay</option>

    <option value="8000">8 sn/olay</option>
    <option value="12000">12 sn/olay</option>
  </select>

  <div id="tarih-goster">—</div>

       Kullanıcının şikâyeti "toprak kazandı mı kaybetti mi anlayamıyorum"du —
       cevabı kapatılabilir bir yerde duramaz. Buraya taşındı: zaman çubuğu
       zaten "şu an neredeyiz" şeridi, "şu an ne kadar toprak" onun karşılığı. -->
  <div id="alan-goster"></div>
</footer>

<!-- ARAYUZ-4-SARTNAME.md ② — üç ayar (irtifa/yakınlık/hız) burada, kip ve
     onay kutusu kronoloji başlığında (Emre'nin isteği, ikisi ayrı yerde). -->
<div id="ayarlar-pencere" class="gizli">
  <div id="ayarlar-kutu">
    <button id="ayarlar-kapat" title="Kapat">✕</button>
    <h3>⚙ Ayarlar</h3>
    <!-- DUYGU-VE-SEKME-SARTNAME.md §A② — bu katman TDV'ye BASMAZ, yorumdur.
         Ayardan açılır/kapanır (pazarlık dışı kural); varsayılan AÇIK çünkü
         kapalıyken kimse varlığını bilmez (şartnamenin kendi önerisi). -->
    <div class="ayar-satir ayar-satir-anahtar">
      <label for="duygu-ac">😊 Duygu emojileri <span class="ayar-ipucu">(okuyanın tepkisi — kaynağın hükmü değil, TDV'ye basmaz)</span></label>
      <input type="checkbox" id="duygu-ac" checked>
    </div>
    <h3 class="ayar-altbaslik">🛩 Uçuş kipi</h3>
    <div class="ayar-satir">
      <label for="ayar-irtifa">İrtifa <span class="ayar-ipucu">(yayın tepe yüksekliği)</span></label>
      <input type="range" id="ayar-irtifa" min="0.5" max="3" step="0.1" value="1.42">
      <span id="ayar-irtifa-deger" class="ayar-deger"></span>
    </div>
    <div class="ayar-satir">
      <label for="ayar-yakinlik">Yakınlık <span class="ayar-ipucu">(olay mahalline inilecek zoom — etiket GÖRÜNEN ALANI gösterir)</span></label>
      <!-- §⑧③ — Emre: "çok yaklaşıyor, etrafı göremiyorum." Sürgü zoom
           SAYISI değil ekranda kaç km göründüğünü göstermeli. Uçlar/varsayılan
           GERÇEK ölçümle kondu (js/app.js yakinlikKmHesapla, harita
           kapsayıcısının kendi genişliği + MapLibre'nin 512px döşeme
           dönüşümüyle): min 3 ≈ 9.000 km (imparatorluk + komşular),
           max 8 ≈ 230 km (bir sancak ölçeği), varsayılan 5.5 ≈ 950-1.360 km
           (Anadolu ölçeği) — eski varsayılan 6.5 ≈ 660 km'ydi, "çok
           yaklaşıyor" şikâyetinin ölçülen karşılığı buydu. -->
      <input type="range" id="ayar-yakinlik" min="3" max="8" step="0.1" value="5.5">
      <span id="ayar-yakinlik-deger" class="ayar-deger"></span>
    </div>
    <div class="ayar-satir">
      <label for="ayar-hiz">Hız <span class="ayar-ipucu">(küçük = yavaş)</span></label>
      <input type="range" id="ayar-hiz" min="0.3" max="3" step="0.1" value="1.2">
      <span id="ayar-hiz-deger" class="ayar-deger"></span>
    </div>
    <div class="ayar-satir">
      <label for="ayar-kenarpay">Kenar payı <span class="ayar-ipucu">(nokta yeri olmayan olayda imparatorluk görünümünün çevre boşluğu)</span></label>
      <input type="range" id="ayar-kenarpay" min="10" max="120" step="5" value="55">
      <span id="ayar-kenarpay-deger" class="ayar-deger"></span>
    </div>
    <p class="ayar-not">⚠️ Bu dört değer MapLibre'nin belgelenmiş varsayılanları
      (curve 1.42 · speed 1.2) çevresinde kuruldu — bu oturumda harita
      render olmadığı için GÖZLE ayarlanamadı. İlk gerçek kullanımda
      gözden geçirilmeli.</p>
  </div>
</div>

    <div id="dizin-sekmeler">

    <div id="dizin-icerik"></div>
  </div>
