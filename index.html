<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osmanlı Tarih Atlası (1281–1923)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=r31">
</head>
<body>
<header id="ustbar">
  <h1>🕌 Osmanlı Tarih Atlası <span class="alt">1281–1923</span></h1>
  <button id="btn-dizin" title="Kişi, savaş ve antlaşma dizinleri">📚 Dizin</button>
  <button id="btn-tamekran" title="Tam ekran (F11)">⛶</button>
  <div id="donem-etiketi"></div>
</header>

<main id="govde">
  <div id="harita">
    <button id="btn-panel" title="Yan paneli gizle/göster (haritayı büyüt)">⇥ Panel</button>
    <!-- Bölge önayarları: seçilen bölgeye yakınlaşır, oradaki yerleşimler açılır -->
    <div id="bolge-secici">
      <select id="bolge" title="Bölgeye yakınlaş">
        <option value="">🌍 Tüm imparatorluk</option>
        <option value="anadolu">Anadolu</option>
        <option value="rumeli">Rumeli / Balkanlar</option>
        <option value="avrupa">Orta Avrupa (Macaristan)</option>
        <option value="ege">Ege ve adalar</option>
        <option value="karadeniz">Karadeniz kuzeyi / Rus sınırı</option>
        <option value="kafkas">Kafkasya ve İran sınırı</option>
        <option value="suriye">Suriye ve Irak</option>
        <option value="hicaz">Hicaz ve Yemen</option>
        <option value="misir">Mısır ve Sudan</option>
        <option value="afrika">Kuzey Afrika</option>
      </select>
    </div>
  </div>

  <aside id="yanpanel">
    <section id="padisah-karti">
      <div id="padisah-portre"></div>
      <div id="padisah-bilgi">
        <div id="padisah-ad">—</div>
        <div id="padisah-saltanat"></div>
      </div>
    </section>
    <section id="olay-akisi">
      <h2>
        <span>📜 Kronoloji</span>
        <span id="olay-sayac"></span>
      </h2>
      <div id="olay-listesi"></div>
    </section>
    <!-- Olay bilgi paneli: haritanın üzerinde değil, kronolojinin ALTINDA -->
    <section id="olay-bilgi" class="gizli">
      <button id="olay-bilgi-kapat" title="Kapat">✕</button>
      <div id="ob-ust">
        <div id="ob-gorsel"></div>
        <div id="ob-baslikalan">
          <div id="ob-tarih"></div>
          <div id="ob-baslik"></div>
          <div id="ob-meta"></div>
        </div>
      </div>
      <div id="ob-detay"></div>
      <div id="ob-ozel"></div>
    </section>
  </aside>
</main>

<footer id="zamanbar">
  <button id="btn-geri" title="Önceki olaya git">⏮</button>
  <button id="btn-oynat" title="Oynat / Duraklat">▶</button>
  <button id="btn-ileri" title="Sonraki olaya git">⏭</button>
  <select id="akis-modu" title="Akış tipi: doğrusal zaman veya olay olay">
    <option value="zaman" selected>⏱ Zaman akışı</option>
    <option value="olay">📜 Olay olay</option>
  </select>
  <select id="hiz" title="Oynatma hızı (gün/saniye)">
    <option value="30">Yavaş (ay/sn)</option>
    <option value="180" selected>Normal (6 ay/sn)</option>
    <option value="730">Hızlı (2 yıl/sn)</option>
    <option value="3650">Çok hızlı (10 yıl/sn)</option>
  </select>
  <select id="olay-hiz" title="Her olayda bekleme süresi" style="display:none">
    <option value="3000">3 sn/olay</option>
    <option value="5000" selected>5 sn/olay</option>
    <option value="8000">8 sn/olay</option>
    <option value="12000">12 sn/olay</option>
  </select>
  <button id="btn-zoom" title="Otomatik yakınlaştırma: toprak büyüdükçe uzaklaş">🔍 Oto</button>
  <input type="range" id="zaman" min="0" max="0" step="1">
  <div id="tarih-goster">—</div>
</footer>

<div id="olay-detay" class="gizli">
  <div id="olay-detay-kutu">
    <button id="detay-kapat">✕</button>
    <div id="detay-tarih"></div>
    <h3 id="detay-baslik"></h3>
    <div id="detay-meta"></div>
    <p id="detay-metin"></p>
    <a id="detay-kaynak" target="_blank" rel="noopener"></a>
    <button id="detay-git">📍 Bu tarihe git</button>
  </div>
</div>

<div id="dizin" class="gizli">
  <div id="dizin-kutu">
    <button id="dizin-kapat">✕</button>
    <h3>📚 Dizinler</h3>
    <div id="dizin-sekmeler">
      <button data-s="kisiler" class="aktif">👤 Kişiler</button>
      <button data-s="savaslar">⚔ Savaşlar</button>
      <button data-s="antlasmalar">📜 Antlaşmalar</button>
      <button data-s="seriler">🔗 Savaş Serileri</button>
      <button data-s="sehirler">🏙 Şehirler ve Kaleler</button>
      <button data-s="devletler">🏛 Devletler</button>
    </div>
    <div id="dizin-icerik"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data/padisahlar.js?v=r31"></script>
<script src="data/olaylar.js?v=r31"></script>
<script src="data/olaylar_ek.js?v=r31"></script>
<script src="data/olaylar_ek2.js?v=r31"></script>
<script src="data/olaylar_ek3.js?v=r31"></script>
<script src="data/olaylar_ek4.js?v=r31"></script>
<script src="data/olaylar_ek5.js?v=r31"></script>
<script src="data/olaylar_ek6.js?v=r31"></script>
<script src="data/devletler.js?v=r31"></script>
<script src="data/kisiler.js?v=r31"></script>
<script src="data/savaslar.js?v=r31"></script>
<script src="data/yerlesimler.js?v=r31"></script>
<script src="data/bolgeler.js?v=r31"></script>
<script src="data/devletler_harita.js?v=r31"></script>
<script src="data/sehirler.js?v=r31"></script>
<script src="data/donemler.js?v=r31"></script>
<script src="js/app.js?v=r31"></script>
</body>
</html>
