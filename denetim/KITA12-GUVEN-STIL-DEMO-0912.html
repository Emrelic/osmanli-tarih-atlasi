<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Güven Kuşakları — 3 Stil Demo (KITA 12)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e1116;}
  #harita{position:absolute;inset:0;}
  .guven-banner{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:50;
    background:rgba(178,24,24,.94);color:#fff;padding:6px 16px;border-radius:6px;
    font:600 13px/1.4 -apple-system,"Segoe UI",sans-serif;letter-spacing:.2px;
    text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap;
  }
  .kontrol{position:absolute;bottom:10px;left:10px;z-index:50;background:rgba(20,20,20,.85);
    padding:8px 10px;border-radius:6px;font:12px sans-serif;color:#eee;}
  .kontrol button{margin-right:6px;padding:4px 10px;cursor:pointer;}
  .kontrol button.aktif{background:#b81818;color:#fff;border:none;}
</style>
</head>
<body>
<div id="harita"></div>
<div class="kontrol">
  STİL: <button id="b1">1 soluk</button><button id="b2">2 taralı</button><button id="b3">3 kesikli kenar</button>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
// ── Sentetik "devlet gövdesi" — gerçek Osmanlı geometrisi DEĞİL, yalnız
// stil karşılaştırması için kaba bir çokgen (Anadolu'ya benzer bir bölge).
var GOVDE = { type:"Feature", properties:{renk:"#8e0b22"}, geometry:{ type:"Polygon", coordinates:[[
  [27.0,40.5],[31.5,41.2],[36.0,41.0],[40.5,40.2],[43.0,38.5],[41.5,36.5],
  [37.0,36.0],[32.0,36.3],[28.5,37.5],[26.5,39.0],[27.0,40.5]
]]}};
// Sentetik "idare noktaları" — gerçek yerleşim VERİSİ değil, örnek.
var NOKTALAR = [
  [29.06,40.18], // Bursa
  [35.0,39.5],   // Sivas civarı
  [40.0,38.5],   // Erzincan civarı
  [32.85,39.93]  // Ankara civarı
];
var GUVEN_YARICAP = { yuksek:50, orta:100, dusuk:200 };
function _kmDaireHalkasi(lon, lat, km, kenar) {
  kenar = kenar || 48;
  var co = Math.cos(lat*Math.PI/180) || 0.0001, halka=[];
  for (var i=0;i<=kenar;i++){var a=(i/kenar)*Math.PI*2;
    halka.push([lon+(km*Math.sin(a))/(111.32*co), lat+(km*Math.cos(a))/111.32]);}
  return halka;
}
function _guvenAnnulus(lon,lat,kmDis,kmIc){
  var dis=_kmDaireHalkasi(lon,lat,kmDis,48), ic=_kmDaireHalkasi(lon,lat,kmIc,48).slice().reverse();
  return [dis,ic];
}
function guvenDesenKur(map){
  var K=8, veri=new Uint8Array(K*K*4);
  for(var y=0;y<K;y++)for(var x=0;x<K;x++){var cizgi=((x+y)%K)<2,i=(y*K+x)*4;
    veri[i]=255;veri[i+1]=255;veri[i+2]=255;veri[i+3]=cizgi?190:0;}
  map.addImage("guven-tarali",{width:K,height:K,data:veri});
}

var map = new maplibregl.Map({
  container: "harita",
  style: { version: 8, sources: {}, layers: [
    { id:"arkaplan", type:"background", paint:{"background-color":"#e8e2d0"} }
  ]},
  center: [34, 39], zoom: 5.6
});
map.on("load", function () {
  guvenDesenKur(map);
  map.addSource("govde", { type:"geojson", data: GOVDE });
  map.addLayer({ id:"govde-dolgu", type:"fill", source:"govde",
    paint:{ "fill-color": ["get","renk"], "fill-opacity": 1 } });
  map.addLayer({ id:"govde-cizgi", type:"line", source:"govde",
    paint:{ "line-color": ["get","renk"], "line-width":1.5 } });

  var ortaFs = NOKTALAR.map(function(nk){ return {type:"Feature",properties:{},
    geometry:{type:"Polygon", coordinates:_guvenAnnulus(nk[0],nk[1],GUVEN_YARICAP.orta,GUVEN_YARICAP.yuksek)}};});
  var dusukFs = NOKTALAR.map(function(nk){ return {type:"Feature",properties:{},
    geometry:{type:"Polygon", coordinates:_guvenAnnulus(nk[0],nk[1],GUVEN_YARICAP.dusuk,GUVEN_YARICAP.orta)}};});
  map.addSource("guven-orta", { type:"geojson", data:{type:"FeatureCollection",features:ortaFs} });
  map.addSource("guven-dusuk", { type:"geojson", data:{type:"FeatureCollection",features:dusukFs} });

  map.addLayer({ id:"guven-orta-dolgu", type:"fill", source:"guven-orta", layout:{visibility:"none"},
    paint:{ "fill-color":"#ffffff", "fill-opacity":0.22 } });
  map.addLayer({ id:"guven-dusuk-dolgu", type:"fill", source:"guven-dusuk", layout:{visibility:"none"},
    paint:{ "fill-color":"#ffffff", "fill-opacity":0.42 } });
  map.addLayer({ id:"guven-orta-tarali", type:"fill", source:"guven-orta", layout:{visibility:"none"},
    paint:{ "fill-pattern":"guven-tarali", "fill-opacity":0.55 } });
  map.addLayer({ id:"guven-dusuk-tarali", type:"fill", source:"guven-dusuk", layout:{visibility:"none"},
    paint:{ "fill-pattern":"guven-tarali", "fill-opacity":1 } });
  map.addLayer({ id:"guven-kenar-100", type:"line", source:"guven-orta", layout:{visibility:"none","line-join":"round"},
    paint:{ "line-color":"#ffffff", "line-width":1.6, "line-dasharray":[2,2], "line-opacity":0.9 } });
  map.addLayer({ id:"guven-kenar-200", type:"line", source:"guven-dusuk", layout:{visibility:"none","line-join":"round"},
    paint:{ "line-color":"#ffffff", "line-width":1.2, "line-dasharray":[1,3], "line-opacity":0.8 } });

  var banner = document.createElement("div");
  banner.className = "guven-banner";
  document.getElementById("harita").appendChild(banner);
  function stilSec(s){
    ["guven-orta-dolgu","guven-dusuk-dolgu"].forEach(id=>map.setLayoutProperty(id,"visibility",s===1?"visible":"none"));
    ["guven-orta-tarali","guven-dusuk-tarali"].forEach(id=>map.setLayoutProperty(id,"visibility",s===2?"visible":"none"));
    ["guven-kenar-100","guven-kenar-200"].forEach(id=>map.setLayoutProperty(id,"visibility",s===3?"visible":"none"));
    var ad = {1:"soluk dolgu",2:"taralı dolgu",3:"kesikli kenar"}[s];
    banner.textContent = "🔴 PROTOTİP — KUŞ UÇUŞU MESAFE, GERÇEK YÜRÜME MALİYETİ DEĞİL · SENTETİK ÖRNEK GÖVDE · stil: " + ad;
    ["b1","b2","b3"].forEach((id,i)=>document.getElementById(id).classList.toggle("aktif", i+1===s));
    window.__stil = s;
  }
  document.getElementById("b1").onclick=function(){stilSec(1);};
  document.getElementById("b2").onclick=function(){stilSec(2);};
  document.getElementById("b3").onclick=function(){stilSec(3);};
  stilSec(1);
  window.__stilSec = stilSec;
  window.__haritaHazir = true;
});
</script>
</body>
</html>
