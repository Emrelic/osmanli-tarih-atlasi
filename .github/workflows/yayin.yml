# KRONOATLAS yayın hattı (P2, 16 Kasım 2026).
# `main`e her push'ta YALNIZ site dosyalarını (arac/yayin_paketle.py) GitHub Pages'e yayınlar.
# ⚠️ ETKİSİ İÇİN: depo Ayarları → Pages → Source = "GitHub Actions" OLMALI (Emre/EMRELİC kararı).
# O ayar "Deploy from a branch" iken bu iş koşar ama canlı site DEĞİŞMEZ (eski kip yayında kalır).
name: yayin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site paketini kur (yalnız site dosyaları)
        run: python arac/yayin_paketle.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
